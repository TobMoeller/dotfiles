onboarding = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+y"
detach = "prefix+d"

new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"

split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

previous_workspace = "alt+k"
next_workspace = "alt+j"
previous_agent = "alt+h"
next_agent = "alt+l"

navigate_pane_left = ""
navigate_pane_right = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-nav.right"

[ui]
confirm_close = true
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[experimental]
pane_history = false
