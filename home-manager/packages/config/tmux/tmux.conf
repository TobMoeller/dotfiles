# This file is symlinked out of the nix store (mkOutOfStoreSymlink), so edits
# here apply immediately. Reload with 'PREFIX r'.

### General ###################################################################

unbind C-b
set -g prefix C-y
bind C-y send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on        # reindex windows when one is closed
set -g history-limit 10000
set -g mouse on
set -s escape-time 0              # no delay on <Esc> (vim mode switching)
set -g focus-events on
set -g detach-on-destroy off      # stay attached when killing a session
set -g set-titles on              # let tmux set the terminal title
setw -g aggressive-resize on

### Terminal & colors #########################################################
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:RGB"
# undercurl + its colors
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

### Activity ##################################################################

setw -g monitor-activity on
set -g bell-action any
set -g visual-bell off
set -g visual-activity off

### Copy mode (vi) ############################################################

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# yank to the system clipboard (pbcopy on macOS, xclip elsewhere)
if-shell "command -v sw_vers >/dev/null" {
  bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
} {
  bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
}

### Status bar ################################################################

set -g status-left-length 100
set -g status-right-length 100
set -g status-left " #{session_name}  "
set -g status-right "#{pane_title} "
set -g status-style "fg=#7C7D83 bg=#242631"
set -g window-status-format "#{window_index}:#{pane_current_command}#{window_flags} "
set -g window-status-current-format "#{window_index}:#{pane_current_command}#{window_flags} "
set -g window-status-current-style "fg=#E9E9EA"
set -g window-status-activity-style none

### Keybindings ###############################################################
# -r repeatable without re-pressing prefix, -n no prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Windows
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r p previous-window
bind -r C-n next-window
bind -r C-p previous-window
bind Space last-window
bind ^ switch-client -l
# Move the current window left/right
bind -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
bind -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"

# Splits, keeping the current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Pane navigation (vim style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Seamless pane/split navigation with vim (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

### Project / worktree sessions ###############################################
# 'PREFIX F' jump to a project, 'PREFIX D' to the dotfiles.
# 'PREFIX W' enters the worktree key table: w switch, a add, r remove.
# ('PREFIX f' keeps its default find-window, 'PREFIX w' its choose-tree.)

bind F new-window t
bind D run-shell "t ~/code/tobmoeller/dotfiles"

bind w choose-tree -Zw          # restore the default (was overridden)
bind W switch-client -T worktree
bind -T worktree w display-popup -E "wt"
bind -T worktree a display-popup -E "wt add"
bind -T worktree r display-popup -E "wt rm"
