
general.import = [
    "$HOME/.config/alacritty/catppuccin-mocha.toml"
]

[window]
# macOS only (ignored elsewhere): make the Option key send Alt/Meta instead of
# typing special characters, so herdr's Alt+hjkl space/agent bindings work.
option_as_alt = "Both"

[env]
# TERM = "xterm-256color"

[font]
size = 14.0

[font.normal]
family = "MesloLGS NF"

[font.offset]
x = 1
y = 4

